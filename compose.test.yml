services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: admission_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d admission_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  api-a: &test-api
    image: onnorokom-test-api
    build:
      context: ./backend
      target: runtime
    environment:
      ConnectionStrings__Default: &test-connection "Host=db;Port=5432;Database=admission_test;Username=postgres;Password=postgres;Maximum Pool Size=12"
      STUDENT_HOLD_SCOPE: session
      Logging__LogLevel__Default: Warning
    depends_on:
      db:
        condition: service_healthy

  api-b: *test-api

  backend-tests:
    build:
      context: ./backend
      target: test
    environment:
      ADMISSION_TEST_CONNECTION: *test-connection
      Logging__LogLevel__Default: Warning
      TEST_API_A: http://api-a:8080
      TEST_API_B: http://api-b:8080
    depends_on:
      db:
        condition: service_healthy
      api-a:
        condition: service_started
      api-b:
        condition: service_started
